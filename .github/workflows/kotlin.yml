# Reusable workflow for every NothingEats Kotlin repo (platform, services, template).
#
# - build: compile, ktlint, tests (Testcontainers) on every push and pull request
# - dependencies: submits the Gradle dependency graph on main (feeds dependency review)
#
# Images are built by kotlin-image.yml, a separate workflow so callers that never push
# an image (the platform) do not have to grant packages or id-token permissions.
#
# The platform is consumed as a composite build: it is checked out next to the repo,
# exactly like in the local workspace.
name: kotlin

on:
  workflow_call:
    inputs:
      checkout-platform:
        description: Check out nothingeats-kotlin-platform next to the repo (false for the platform itself)
        type: boolean
        default: true
      platform-ref:
        description: Git ref of nothingeats-kotlin-platform to build against
        type: string
        default: main
      verify-image:
        description: Build the image as a tarball on every run, without pushing (template)
        type: boolean
        default: false

permissions: {}

env:
  JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - if: inputs.checkout-platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-kotlin-platform
          ref: ${{ inputs.platform-ref }}
          path: nothingeats-kotlin-platform
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test
        working-directory: repo
        run: ./gradlew build --console=plain
      # A tarball can only hold one platform; the multi-arch push happens in kotlin-image.yml.
      - name: Build image tarball
        if: inputs.verify-image
        working-directory: repo
        run: ./gradlew :app:jibBuildTar --console=plain -Djib.from.platforms=linux/amd64
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: repo/**/build/reports/tests/
          retention-days: 7

  dependencies:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - if: inputs.checkout-platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-kotlin-platform
          ref: ${{ inputs.platform-ref }}
          path: nothingeats-kotlin-platform
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: repo
