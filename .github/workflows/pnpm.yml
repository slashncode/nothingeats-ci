# Reusable workflow for every NothingEats pnpm repo (nothingeats-ui, web apps, Node services):
# install with the frozen lockfile, then lint, typecheck, test and build through the repo's own
# package scripts. The pnpm version comes from the `packageManager` field of package.json.
#
# Apps consume nothingeats-ui from a sibling checkout (`file:../nothingeats-ui`), the same layout
# as the local workspace: with `checkout-ui`, it is checked out next to the repo and built first.
# Services that generate a gRPC client from another repo's protos check it out with
# `checkout-repos`, get buf with `buf`, and prove the committed code is current in `gen:check`.
name: pnpm

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "24"
      browser-tests:
        description: Install Chromium for Playwright before the tests (Vitest browser mode, Storybook tests)
        type: boolean
        default: false
      checkout-ui:
        description: Check out and build nothingeats-ui next to the repo (apps that depend on it)
        type: boolean
        default: false
      ui-ref:
        description: Git ref of nothingeats-ui to build against
        type: string
        default: main
      checkout-repos:
        description: Other NothingEats repos to check out next to this one (e.g. the producer of a gRPC contract), space-separated
        type: string
        default: ""
      buf:
        description: Install buf (for a `gen:check` script that regenerates code from protos)
        type: boolean
        default: false

permissions: {}

# Keep in sync with buf.yml.
env:
  BUF_VERSION: "1.75.0"
  BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - if: inputs.checkout-ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-ui
          ref: ${{ inputs.ui-ref }}
          path: nothingeats-ui
          persist-credentials: false
      - name: Check out other repos
        if: inputs.checkout-repos != ''
        env:
          REPOS: ${{ inputs.checkout-repos }}
        run: |
          for repo in $REPOS; do
            git clone --depth 1 "https://github.com/slashncode/${repo}.git" "${repo}"
          done
      - name: Install buf
        if: inputs.buf
        run: |
          curl -sSfL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  /usr/local/bin/buf" | sha256sum --check
          chmod +x /usr/local/bin/buf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: repo/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
      - name: Build nothingeats-ui
        if: inputs.checkout-ui
        working-directory: nothingeats-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install
        working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Generated code is current
        working-directory: repo
        run: pnpm run --if-present gen:check
      - name: Lint
        working-directory: repo
        run: pnpm lint
      - name: Typecheck
        working-directory: repo
        run: pnpm typecheck
      - name: Install Chromium
        if: inputs.browser-tests
        working-directory: repo
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        working-directory: repo
        run: pnpm test
      - name: Build
        working-directory: repo
        run: pnpm build
