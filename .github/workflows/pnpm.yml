# Reusable workflow for every NothingEats pnpm repo (nothingeats-ui, web apps):
# install with the frozen lockfile, then lint, typecheck, test and build through the repo's own
# package scripts. The pnpm version comes from the `packageManager` field of package.json.
name: pnpm

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "24"
      browser-tests:
        description: Install Chromium for Playwright before the tests (Vitest browser mode, Storybook tests)
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Chromium
        if: inputs.browser-tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
